name: CI Build & Package

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            build_type: Release
            wine_patch: false
            platform: Linux-x86_64
          - os: windows-2022
            name: Windows
            build_type: Release
            wine_patch: false
            platform: Windows-x64
          - os: windows-2022
            name: Windows-WinePatched
            build_type: Release
            wine_patch: true
            platform: Windows-WinePatched-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Determine Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "val=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "val=v0.1.0" >> $GITHUB_OUTPUT
          fi

      - name: Setup JUCE with Wine Compatibility Patch
        if: matrix.wine_patch == true
        shell: bash
        run: |
          mkdir -p build/_deps
          git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git build/_deps/juce-src
          cd build/_deps/juce-src
          git apply ../../../patches/juce8_wine_compatibility.patch

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            ninja-build

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build All Targets
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Prepare Staging Directory (Linux)
        if: runner.os == 'Linux'
        run: |
          ZIP_NAME="SunVoxPlugin-${{ steps.version.outputs.val }}-${{ matrix.platform }}.zip"
          mkdir -p staging/VST3 staging/CLAP staging/Standalone staging/assets
          cp -r build/SunVoxPlugin_artefacts/${{ matrix.build_type }}/VST3/SunVoxPlugin.vst3 staging/VST3/
          cp build/SunVoxPlugin_artefacts/${{ matrix.build_type }}/CLAP/SunVoxPlugin.clap staging/CLAP/
          cp build/SunVoxPlugin_artefacts/${{ matrix.build_type }}/CLAP/sunvox.so staging/CLAP/ || cp sunvox_lib/linux/x86_64/sunvox.so staging/CLAP/
          cp build/SunVoxPlugin_artefacts/${{ matrix.build_type }}/Standalone/SunVoxPlugin staging/Standalone/
          cp build/SunVoxPlugin_artefacts/${{ matrix.build_type }}/Standalone/sunvox.so staging/Standalone/ || cp sunvox_lib/linux/x86_64/sunvox.so staging/Standalone/
          cp -r assets/* staging/assets/
          cd staging && zip -r ../${ZIP_NAME} .

      - name: Prepare Staging Directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zipName = "SunVoxPlugin-${{ steps.version.outputs.val }}-${{ matrix.platform }}.zip"
          New-Item -ItemType Directory -Force -Path staging/VST3, staging/CLAP, staging/Standalone, staging/assets
          $vst3 = Get-ChildItem -Path "build" -Filter "SunVoxPlugin.vst3" -Recurse | Select-Object -First 1
          Copy-Item -Recurse -Force $vst3.FullName "staging/VST3/"
          $clap = Get-ChildItem -Path "build" -Filter "SunVoxPlugin.clap" -Recurse | Select-Object -First 1
          Copy-Item -Force $clap.FullName "staging/CLAP/"
          Copy-Item -Force "sunvox_lib/sunvox_lib/windows/lib_x86_64/sunvox.dll" "staging/CLAP/"
          $exe = Get-ChildItem -Path "build" -Filter "SunVoxPlugin.exe" -Recurse | Select-Object -First 1
          Copy-Item -Force $exe.FullName "staging/Standalone/"
          Copy-Item -Force "sunvox_lib/sunvox_lib/windows/lib_x86_64/sunvox.dll" "staging/Standalone/"
          Copy-Item -Recurse -Force "assets/*" "staging/assets/"
          Compress-Archive -Path "staging/*" -DestinationPath "$zipName" -Force

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SunVoxPlugin-${{ steps.version.outputs.val }}-${{ matrix.platform }}
          path: SunVoxPlugin-${{ steps.version.outputs.val }}-${{ matrix.platform }}.zip
          retention-days: 1
          if-no-files-found: error

      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: SunVoxPlugin-${{ steps.version.outputs.val }}-${{ matrix.platform }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
